<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: flex;
        border: 2px solid black;
        flex-direction: row-reverse;

      }
      .container div {
        display: flex;
        margin: 20px;
        justify-content: center;
        align-items: center;
        border: 2px solid black;
        height: 100px;
        width: 100px;
        background-color: rgb(201, 192, 210);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>Box 1</div>
      <div>Box 2</div>
      <div>Box 3</div>
    </div>
