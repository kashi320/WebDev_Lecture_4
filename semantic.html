<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .header {
        height: 100px;
        background-color: rgb(222, 218, 225);
        border: 2px solid black;
        display: flex;
        justify-content: space-between;
      }
      .header a {
        background-color: rgb(100, 100, 158);
        height: 20px;
        padding: 10px;
        margin: 10px;
        border-radius: 19px;
        color: rgb(4, 4, 4);
      }
      .sidepanel {
        width: 25%;
        border: 2px solid black;
        height: 1000px;
        background-color: rgb(68, 30, 30);
        float: left;
        display: flex;
        flex-direction: column;
      }
      .sidepanel a {
        background-color: black;
        width: 80px;
        height: 20px;
        padding: 10px;
        margin: 10px;
        border-radius: 19px;
        color: white;
      }
      .herosection {
        width: 73.7%;
        border: 2px solid black;
        float: left;
        height: 700px;
        background-color: black;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <a href="">Home</a>
      <a href="">Achievement</a>
      <a href="">Contact</a>
      <a href="">Gallery</a>
    </div>
    <div class="sidepanel">
      <a href="">Home</a>
      <a href="">Achievement</a>
      <a href="">Contact</a>
      <a href="">Gallery</a>
    </div>
    <div class="herosection">HeroSection</div>
  </body>
</html>
